apiVersion: 1

providers:
  - name: lowfarm
    orgId: 1
    folder: LowFarm
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Dashboard JSON lives outside /etc/grafana/provisioning so that the
      # provider config is not shadowed by its own mount.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
